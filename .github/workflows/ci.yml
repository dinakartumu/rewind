name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Lint OpenAPI spec
        run: npm run lint:api

      - name: Validate Claude Code files
        run: npx claude-code-lint@latest

      - name: Check unused dependencies
        run: npm run lint:deps -- --no-exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      REWIND_DOCS_SSH_KEY: ${{ secrets.REWIND_DOCS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The generated reference lives in the rewind-docs repo, so the
      # staleness check needs a checkout of it. Skipped when the secret is
      # absent (forks), since the check cannot run without access. Link
      # checking now belongs to that repo's own build.
      - name: Check out docs repo
        id: docs_checkout
        if: env.REWIND_DOCS_SSH_KEY != ''
        run: |
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$REWIND_DOCS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 \
              git@github.com:dinakartumu/rewind-docs.git \
              "${RUNNER_TEMP}/rewind-docs"
          echo "dir=${RUNNER_TEMP}/rewind-docs" >> "$GITHUB_OUTPUT"

      - name: Check MCP tool reference is up to date
        if: steps.docs_checkout.outputs.dir != ''
        env:
          REWIND_DOCS_DIR: ${{ steps.docs_checkout.outputs.dir }}
        run: npx tsx scripts/gen-mcp-reference.ts --check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build (dry run)
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --omit=dev

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Dependency review
        # Requires the Dependency Graph feature, which is disabled by default
        # on forks (Settings -> Code security -> Dependency graph). Until it's
        # enabled the action errors "not supported on this repository", so this
        # step is advisory only. Enable Dependency Graph and drop
        # continue-on-error to make it a hard gate.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
