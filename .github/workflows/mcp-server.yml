name: MCP Server

on:
  push:
    tags:
      - 'mcp-server-v*'
    branches: [main]
    paths:
      - 'mcp-server/**'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/**'

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    env:
      REWIND_DOCS_SSH_KEY: ${{ secrets.REWIND_DOCS_SSH_KEY }}
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci
      - run: npm run build:web
      - run: npm run build
      - run: npm test

      # The docs live in a separate private repo served by Pageloop, so the
      # drift check needs a checkout of it. Access is a read-only deploy key
      # on rewind-docs. Skipped when the secret is absent (forks), since the
      # check cannot run without access.
      - name: Check out docs repo
        id: docs_checkout
        if: env.REWIND_DOCS_SSH_KEY != ''
        working-directory: ${{ github.workspace }}
        run: |
          KEY_FILE="$(mktemp)"
          # Written via printf, not the heredoc-prone echo, so the trailing
          # newline OpenSSH requires survives.
          printf '%s\n' "$REWIND_DOCS_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 \
              git@github.com:dinakartumu/rewind-docs.git \
              "${RUNNER_TEMP}/rewind-docs"
          echo "dir=${RUNNER_TEMP}/rewind-docs" >> "$GITHUB_OUTPUT"

      - name: Verify MDX docs reference every registered tool/prompt/resource
        if: steps.docs_checkout.outputs.dir != ''
        env:
          REWIND_DOCS_DIR: ${{ steps.docs_checkout.outputs.dir }}
        run: node scripts/check-docs.mjs

      - name: Verify package contents
        run: npm pack --dry-run

      # Catches manual `mcp-server/package.json` version bumps that bypass
      # release-please. Bumps must come from the release-please PR (which
      # updates package.json AND .release-please-manifest.json atomically),
      # never by hand. Without this guard, npm and the manifest drift and
      # the GitHub Releases page goes empty.
      - name: Verify release-please manifest matches package.json
        working-directory: ${{ github.workspace }}
        run: |
          PKG_VERSION=$(node -p "require('./mcp-server/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./.release-please-manifest.json')['mcp-server']")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Version drift: mcp-server/package.json is $PKG_VERSION but .release-please-manifest.json is $MANIFEST_VERSION."
            echo "Do not bump mcp-server/package.json manually. Let release-please open a release PR; merging that PR updates both files atomically."
            exit 1
          fi
          echo "OK: both files at $PKG_VERSION."

  publish-docs:
    name: Publish MCP reference to docs
    needs: build
    runs-on: ubuntu-latest
    # Only from the canonical repo on main. Forks have no key, and a branch
    # build must not rewrite the published reference.
    if: github.ref == 'refs/heads/main' && github.repository == 'dinakartumu/rewind'
    env:
      REWIND_DOCS_PUBLISH_KEY: ${{ secrets.REWIND_DOCS_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Two generated artifacts belong to the docs repo but are produced
      # here: the MCP tool reference (from the manifest) and openapi.json
      # (which drives the site's API Reference). Both are pushed rather
      # than hand-maintained, since a hand-copied spec silently goes stale.
      # Needs a write-capable deploy key; the drift check's key is
      # read-only on purpose.
      - name: Regenerate and push the docs artifacts
        if: env.REWIND_DOCS_PUBLISH_KEY != ''
        run: |
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$REWIND_DOCS_PUBLISH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 \
            git@github.com:dinakartumu/rewind-docs.git \
            "${RUNNER_TEMP}/rewind-docs"

          REWIND_DOCS_DIR="${RUNNER_TEMP}/rewind-docs" npm run docs:gen-mcp
          cp openapi.snapshot.json "${RUNNER_TEMP}/rewind-docs/openapi.json"

          cd "${RUNNER_TEMP}/rewind-docs"
          if git diff --quiet; then
            echo "Docs artifacts already up to date; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/mcp-tools openapi.json
          git commit \
            -m "docs: regenerate MCP tool reference and API spec" \
            -m "Generated from rewind@${GITHUB_SHA}."
          git push

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # npm package rewind-mcp-server is owned by upstream (pdugan20); forks
    # cannot publish to it, so this job only runs on the upstream repo.
    if: >-
      startsWith(github.ref, 'refs/tags/mcp-server-v') &&
      github.repository == 'pdugan20/rewind'
    defaults:
      run:
        working-directory: mcp-server
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundles
        run: npm run build:web

      - name: Build
        run: npm run build

      - name: Check if version is already published
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "rewind-mcp-server@${PKG_VERSION}" version --silent >/dev/null 2>&1; then
            echo "Version ${PKG_VERSION} is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${PKG_VERSION} is new; will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.skip != 'true'
        run: npm publish --provenance --access public

  deploy-worker:
    name: Deploy MCP Worker
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mcp-server-v')
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci

      - name: Build web bundles
        run: npm run build:web

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
